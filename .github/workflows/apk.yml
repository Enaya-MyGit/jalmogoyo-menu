name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Collect the web menu
        run: |
          mkdir -p "$RUNNER_TEMP/web"
          cp -r index.html manifest.webmanifest sw.js css js img "$RUNNER_TEMP/web/"

      - name: Build APK
        working-directory: android
        run: |
          gradle assembleDebug --no-daemon -PwebDir="$RUNNER_TEMP/web"
          cp app/build/outputs/apk/debug/*.apk "$RUNNER_TEMP/jalmogoyo-menu.apk"

      - name: Publish as the latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Jalmogoyo Menu – Android (dernière version)
          body: |
            Fichier à installer sur les tablettes Android : jalmogoyo-menu.apk
            Lien direct : https://github.com/Enaya-MyGit/jalmogoyo-menu/releases/latest/download/jalmogoyo-menu.apk
          make_latest: true
          files: ${{ runner.temp }}/jalmogoyo-menu.apk
